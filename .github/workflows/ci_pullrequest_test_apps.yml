---
# Test all apps in CI
name: "CI - Pull Request Test All Apps"
concurrency:  # Cancel any existing runs of this workflow for this same PR
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true
on:  # yamllint disable
  pull_request:
  workflow_call:

jobs:
  load-db-dump:
    name: "Load migrated nautobot database dump"
    runs-on: "ubuntu-24.04"
    env:
      INVOKE_NAUTOBOT_LOCAL: "True"
      NAUTOBOT_DB_USER: "nautobot"
      NAUTOBOT_DB_PASSWORD: "decinablesprewad"
      PGPASSWORD: "decinablesprewad"
      NAUTOBOT_DB_ENGINE: "django_prometheus.db.backends.postgresql"
    services:
      postgres:
        image: "postgres:13-alpine"
        env:
          POSTGRES_USER: "nautobot"
          POSTGRES_PASSWORD: "decinablesprewad"
          POSTGRES_DB: "nautobot"
        ports:
          - "5432:5432"
      redis:
        image: "redis:6-alpine"
        ports:
          - "6379:6379"
    steps:
      - name: "Checkout db dumps repository"
        uses: actions/checkout@v5
        with:
          repository: "gsnider2195/nautobot-db-dumps"
          ref: "dumps"
          # Relative path under $GITHUB_WORKSPACE to place the repository
          path: "db_dumps"
          # Do a sparse checkout on given patterns. Each pattern should be separated with
          # new lines.
          # Default: null
          sparse-checkout: "nautobotlatest-pgdump.sql"
          # Specifies whether to use cone-mode when doing a sparse checkout.
          # Default: true
          sparse-checkout-cone-mode: false
      - name: "Load database dump into the postgres database"
        run: |
          psql -h localhost -d nautobot -U $NAUTOBOT_DB_USER < db_dumps/nautobotlatest-pgdump.sql
      # For testing, run check-migrations to verify the dump has loaded
      - name: "Check out repository code"
        uses: "actions/checkout@v4"
      - name: "Setup environment"
        uses: "networktocode/gh-action-setup-poetry-environment@v6"
        with:
          poetry-install-options: ""  # override default "--only dev"
          poetry-version: "2.1.4"
          python-version: "3.12"
      - name: "Run check-migrations"
        run: "poetry run invoke check-migrations"


